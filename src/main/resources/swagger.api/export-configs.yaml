openapi: 3.0.0
info:
  title: Data Export Spring Configurations
  version: v1
servers:
  - url: /data-export-spring/
paths:
  /configs:
    get:
      parameters:
        - $ref: "#/components/parameters/trait_queryable_query"
        - $ref: "#/components/parameters/trait_pageable_limit"
      description: Get a list of data export configurations
      operationId: getExportConfigs
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/exportConfigCollection"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
    post:
      description: Add an export configuration
      operationId: postExportConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/exportConfig"
        required: true
      parameters:
        - name: X-Okapi-Tenant
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: good
        '400':
          description: Bad request
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
  /configs/{id}:
    get:
      description: Get a export configuration by the export configuration ID
      operationId: getConfigById
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the export configuration
          schema:
            type: string
      responses:
        "200":
          description: Export configuration successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/exportConfig"
        "400":
          description:
            Bad request, e.g. malformed request body or query parameter.
            Details of the errors (e.g. name of the parameter or line/character number
            with malformed data) provided in the response.
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        "404":
          description: Export configuration with a given ID not found
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        "500":
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
    put:
      description: Change an export configuration
      operationId: putExportConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/exportConfig"
        required: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Okapi-Tenant
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad request
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '404':
          description: Export config not found
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
    delete:
      description: Delete export configuration by UUID
      operationId: deleteExportConfigById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad request
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '404':
          description: Export config not found
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
  /configs/{id}/execute:
    post:
      description:
        Run an export configuration immediately for the given records, ignoring the
        automatic export flags. Only Ordering EDIFACT orders export configurations are supported.
      operationId: executeExportConfig
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the export configuration
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/exportConfigExecuteRequest"
        required: true
      responses:
        '201':
          description: Export job created and sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/exportConfigExecuteResponse"
        '400':
          description: Bad request, e.g. the export configuration cannot be run manually
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '404':
          description: Export configuration with a given ID not found
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
  /effective-configs:
    get:
      description: >
        Get the configurations of an export type and vendor that apply to the config criteria, sorted by configName. For
        EDIFACT_ORDERS_EXPORT, an absent acquisitionMethod or vendorAccount is not a wildcard: only configurations that
        don't require the value match. For CLAIMS, an absent acquisitionMethod returns all configurations of the vendor;
        with one, configurations that select it match, and those without selected methods match if no other selects it.
        The result depends on all configurations of the vendor, and totalRecords is the number of all matches.
      operationId: getEffectiveConfigs
      parameters:
        - $ref: "#/components/parameters/vendor_id"
        - $ref: "#/components/parameters/acquisition_method"
        - $ref: "#/components/parameters/vendor_account"
        - $ref: "#/components/parameters/export_type"
        - $ref: "#/components/parameters/transmission_method"
      responses:
        '200':
          description: The matching configurations, or an empty list if none applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/exportConfigCollection"
        '400':
          description: Bad request, e.g. a missing vendorId or type, a non-UUID id or an unknown or unsupported enum value
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                $ref: "#/components/examples/errors"
              schema:
                $ref: "#/components/schemas/errors"
components:
  schemas:
    exportConfigExecuteRequest:
      description: Records to run an export configuration for
      type: object
      properties:
        poLineIds:
          description: PO line ids to export, ignoring the automatic export flags
          type: array
          minItems: 1
          items:
            description: UUID of the PO line
            type: string
      required:
        - poLineIds
    # Deliberately not the shared job.json schema: this spec is generated with dateLibrary 'java8'
    # while jobs.yaml uses 'java', so generating Job here would overwrite it with OffsetDateTime fields.
    exportConfigExecuteResponse:
      description: Result of running an export configuration
      type: object
      properties:
        jobId:
          description: UUID of the created export job
          type: string
      required:
        - jobId
    exportConfig:
      $ref: '../../../../folio-export-common/schemas/exportConfig.json#/ExportConfig'
    exportConfigWithLegacyBursar:
      $ref: '../../../../folio-export-common/schemas/exportConfigWithLegacyBursar.json#/ExportConfigWithLegacyBursar'
    exportConfigCollection:
      $ref: '../../../../folio-export-common/schemas/exportConfigCollection.json#/ExportConfigCollection'
    errors:
      $ref: '../../../../folio-export-common/schemas/common/errors.json#/Errors'
    effectiveConfigType:
      description: Export type of the configurations
      type: string
      enum:
        - EDIFACT_ORDERS_EXPORT
        - CLAIMS
  parameters:
    trait_queryable_query:
      name: query
      in: query
      description: A query string to filter rules based on matching criteria in fields.
      schema:
        type: string
    trait_pageable_limit:
      name: limit
      in: query
      description: Limit the number of elements returned in the response
      schema:
        default: 10
        type: integer
    vendor_id:
      name: vendorId
      in: query
      description: UUID of the order's vendor
      required: true
      schema:
        type: string
        format: uuid
    acquisition_method:
      name: acquisitionMethod
      in: query
      description: UUID of the acquisition method. Without it, no EDIFACT_ORDERS_EXPORT configuration and every CLAIMS configuration matches
      schema:
        type: string
        format: uuid
    vendor_account:
      name: vendorAccount
      in: query
      description: The vendor account number. Absent means no account
      schema:
        type: string
    export_type:
      name: type
      in: query
      description: Export type of the configurations
      required: true
      schema:
        $ref: "#/components/schemas/effectiveConfigType"
    transmission_method:
      name: transmissionMethod
      in: query
      description: Return only matches with this transmission method
      schema:
        $ref: '../../../../folio-export-common/schemas/acquisitions/vendorEdiOrdersExportConfig.json#/VendorEdiOrdersExportConfig/properties/transmissionMethod'
  examples:
    errors:
      value:
        $ref: '../../../../folio-export-common/examples/errors.sample'
